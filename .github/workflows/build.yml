# Builds the jar for every supported Minecraft version and uploads them as one artifact.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['26.3']
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build for Minecraft ${{ matrix.target }}
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.target }} --stacktrace
          mkdir -p dist
          cp build/libs/*+mc${{ matrix.target }}.jar dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: sky-fade-${{ matrix.target }}
          path: dist/*.jar
