plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def mc = (findProperty('mc') ?: project.mc_default).toString()
def v = new Properties()
file("versions/${mc}.properties").withInputStream { v.load(it) }

version = "${project.mod_version}+mc${mc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets.main {
    java.srcDirs += ["platform/mc${mc}/java"]
    if (v.gl == 'true') java.srcDirs += ['platform/gl/java']
    resources.srcDirs += ["platform/mc${mc}/resources"]
}

dependencies {
    minecraft "com.mojang:minecraft:${v.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${v.loader_version}"
    // Sodium is not needed to compile: its classes are hooked by name.
}

processResources {
    def props = [version: project.version, minecraft_range: v.minecraft_range,
                 loader_min: v.loader_min, java_version: v.java_version]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = v.java_version as int
}

java {
    if (JavaVersion.current() < JavaVersion.toVersion(v.java_version)) {
        toolchain.languageVersion = JavaLanguageVersion.of(v.java_version as int)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
