org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

loom_version=1.16-SNAPSHOT

mod_version=0.3.0
maven_group=io.github.hiveko
archives_base_name=sky-fade

# One jar per Minecraft version. The 26.x jars are built here with -Pmc=<version> (default below) from
# versions/<version>.properties; 1.21.11 and 1.21.1 have their own Gradle projects in mc1.21.11/ and
# mc1.21.1/ (obfuscated versions, built with Mojang mappings and remapped).
# Sources: src/main/java (all versions), platform/mc<version>/, and platform/gl/ for the versions
# whose Sodium draws terrain with its own OpenGL code (26.1.2, 1.21.11, 1.21.1).
mc_default=26.3
